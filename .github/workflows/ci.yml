name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, bcmath, intl, mbstring
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Create databases
        run: mysql -h 127.0.0.1 -uroot -e "CREATE DATABASE prasetya_platform; CREATE DATABASE prasetya_platform_testing; CREATE DATABASE prasetya_platform_e2e;"
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci --ignore-scripts
      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate
      - name: PHP formatter
        run: vendor/bin/pint --test
      - name: PHP static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Component tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Fresh migration and seed on MySQL
        run: php artisan migrate:fresh --seed --force --no-interaction
      - name: Backend tests
        run: vendor/bin/pest
      - name: Production configuration
        env:
          APP_ENV: production
          APP_DEBUG: 'false'
          PAYMENT_GATEWAY: duitku
        run: php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan config:clear && php artisan route:clear && php artisan view:clear
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        env:
          CONTENT_TEXT_PROVIDER: fake # Deterministic AI drafts; never a real provider in CI.
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results

  # Deploys main to cPanel after every quality gate above has passed. Same pattern as prasetya-webworks and
  # satamu-invitation (SSH_PRIVATE_KEY, pinned host key, rsync), plus the Laravel steps. The server owns .env,
  # storage/, and bootstrap/cache/; nothing is copied until the preflight finds .env and a suitable PHP there.
  # See docs/runbooks/deployment.md, "Continuous deployment".
  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-cpanel-platform
      cancel-in-progress: false
    env:
      DEPLOY_HOST: prasetya@server.griv.co.id
      DEPLOY_PATH: public_html/platform.prasetyawebworks.web.id
      # PHP CLI on the server, matching the site's MultiPHP version (cPanel's plain `php` is older).
      SERVER_PHP: /opt/cpanel/ea-php84/root/usr/bin/php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, bcmath, intl, mbstring
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Production dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction --no-scripts
      - name: Build assets
        run: npm ci --ignore-scripts && npm run build
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Secret SSH_PRIVATE_KEY is missing or empty"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null; then
            echo "::error::SSH_PRIVATE_KEY is not a valid private key (copy the whole file, BEGIN to END lines)"
            exit 1
          fi
          echo "server.griv.co.id ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIC2d7PWQgD63Asf8MmFPp7ViTz3QGWHX1b+7l8hU/XCZ" > ~/.ssh/known_hosts
          echo "SSH=ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=30" >> "$GITHUB_ENV"
      # Nothing is copied unless the server is ready: a deploy before the first manual setup changes nothing.
      - name: Preflight on the server
        run: |
          $SSH "$DEPLOY_HOST" "DEPLOY_PATH='$DEPLOY_PATH' SERVER_PHP='$SERVER_PHP' bash -s" <<'REMOTE'
          set -e
          if [ ! -f "$HOME/$DEPLOY_PATH/.env" ]; then
            echo "::error::$DEPLOY_PATH/.env does not exist. Do the first-time setup in docs/runbooks/deployment.md."
            exit 1
          fi
          # composer.lock needs PHP 8.4.1 (Symfony 8).
          "$SERVER_PHP" -r 'exit(version_compare(PHP_VERSION, "8.4.1", ">=") ? 0 : 1);' || { echo "::error::$SERVER_PHP is PHP $("$SERVER_PHP" -r 'echo PHP_VERSION;'), older than 8.4.1: set the SERVER_PHP variable"; exit 1; }
          missing=$("$SERVER_PHP" -r 'echo implode(" ", array_diff(["pdo_mysql","mbstring","openssl","bcmath","intl","ctype","fileinfo","tokenizer","xml"], array_map("strtolower", get_loaded_extensions())));')
          if [ -n "$missing" ]; then echo "::error::Missing PHP extensions on the server: $missing"; exit 1; fi
          echo "Server ready: PHP $("$SERVER_PHP" -r 'echo PHP_VERSION;')"
          REMOTE
      # Callbacks during the short maintenance window get 503, and Duitku retries them.
      - name: Maintenance mode
        run: $SSH "$DEPLOY_HOST" "cd '$DEPLOY_PATH' && if [ -f vendor/autoload.php ]; then '$SERVER_PHP' artisan down --retry=30 || true; fi"
      - name: Upload release
        run: |
          rsync -rlz --delete --chmod=D755,F644 \
            --exclude='/.git/' --exclude='/.github/' --exclude='/node_modules/' --exclude='/tests/' \
            --exclude='/test-results/' --exclude='/playwright-report/' \
            --exclude='/.env' --exclude='/.env.*' --exclude='/storage/' --exclude='/bootstrap/cache/' \
            --exclude='/public/.htaccess' --exclude='/public/.user.ini' --exclude='/public/php.ini' \
            --exclude='/public/.well-known/' --exclude='/public/hot' --exclude='/public/storage' \
            -e "$SSH" ./ "$DEPLOY_HOST:$DEPLOY_PATH/"
          # cPanel may add its PHP handler to public/.htaccess, so Laravel's copy is installed only once.
          rsync -z --ignore-existing --chmod=F644 -e "$SSH" public/.htaccess "$DEPLOY_HOST:$DEPLOY_PATH/public/.htaccess"
      # Stays in maintenance mode if a step fails, so a half-migrated release never serves traffic.
      - name: Migrate and cache
        run: |
          $SSH "$DEPLOY_HOST" "DEPLOY_PATH='$DEPLOY_PATH' SERVER_PHP='$SERVER_PHP' bash -s" <<'REMOTE'
          set -e
          cd "$HOME/$DEPLOY_PATH"
          mkdir -p storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          "$SERVER_PHP" artisan package:discover --ansi
          "$SERVER_PHP" artisan migrate --force --no-interaction
          # Catalogue from code: names and prices. Availability is never changed by a seed.
          "$SERVER_PHP" artisan db:seed --class=ApplicationSeeder --force --no-interaction
          "$SERVER_PHP" artisan db:seed --class=PackageSeeder --force --no-interaction
          "$SERVER_PHP" artisan db:seed --class=ContentBrandSeeder --force --no-interaction
          "$SERVER_PHP" artisan optimize
          "$SERVER_PHP" artisan up
          REMOTE
      - name: Health check
        run: |
          # The server must never serve the environment file or the source.
          for path in .env .env.example composer.json vendor/autoload.php; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://platform.prasetyawebworks.web.id/$path")
            if [ "$code" = 200 ]; then echo "::error::/$path is publicly readable: fix the document root (docs/runbooks/deployment.md)"; exit 1; fi
          done
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://platform.prasetyawebworks.web.id/api/v1/health)
            if [ "$code" = 200 ]; then echo "Healthy"; exit 0; fi
            sleep 5
          done
          echo "::error::Health check returned $code"
          exit 1
